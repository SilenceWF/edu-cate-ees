code: POL-03
title: { el: "Πολιτική Ελέγχου Πρόσβασης και Κωδικών", en: "Access Control and Password Policy" }
version: "1"
effective_date: 2026-01-01
mandatory_all: true
key_rules:
  - el: "Οι κωδικοί πρόσβασης είναι αυστηρά προσωπικοί· δεν τους μοιράζεστε με κανέναν, ούτε με το τμήμα Πληροφορικής."
    en: "Passwords are strictly personal; you do not share them with anyone, not even with IT."
  - el: "Χρησιμοποιείτε μεγάλο και μοναδικό κωδικό για κάθε σύστημα, καθώς και έλεγχο ταυτότητας πολλαπλών παραγόντων (MFA) όπου είναι διαθέσιμος."
    en: "Use a long, unique password for each system and multi-factor authentication (MFA) wherever it is available."
  - el: "Έχετε πρόσβαση μόνο σε ό,τι χρειάζεστε για τη δουλειά σας· κάθε νέα πρόσβαση εγκρίνεται από τον προϊστάμενό σας."
    en: "You have access only to what you need for your job; any new access is approved by your manager."
  - el: "Αν υποψιάζεστε ότι κάποιος έμαθε τον κωδικό σας, αλλάξτε τον αμέσως και ενημερώστε το τμήμα Πληροφορικής."
    en: "If you suspect that someone knows your password, change it immediately and inform IT."
